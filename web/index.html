<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>机的独立工作室</title><link rel="stylesheet" href="/static/style.css"></head><body>
<section id="login" class="login hidden"><div class="login-card"><div class="seal">机</div><p class="overline">TECH MEMORY</p><h1>回到独立工作室</h1><p>输入部署时设置的访问密码。你的项目与记录不会在登录前加载。</p><form id="login-form"><label>访问密码<input id="password" type="password" autocomplete="current-password" required placeholder="TECH_MEMORY_TOKEN"></label><button class="primary" type="submit">进入工作室 <span>→</span></button><p id="login-error" class="error"></p></form></div></section>
<main id="app" class="shell hidden"><aside class="sidebar"><header class="brand"><span class="seal small">机</span><div><b>独立工作室</b><small>TECH MEMORY</small></div></header><nav><button class="nav-active" data-view="workspace"><span class="icon">▦</span>工作台</button><button data-view="search"><span class="icon">⌕</span>全局搜索</button></nav><div class="section-head"><span>项目</span><button id="add-project" title="新建项目">＋</button></div><div id="projects" class="projects"></div><footer><span class="online"></span>服务运行中<button id="logout">退出</button></footer></aside>
<section class="workspace"><header class="topbar"><label class="search"><span>⌕</span><input id="search-input" placeholder="搜索记忆、标签或项目…"><kbd>⌘ K</kbd></label><button id="new-entry" class="primary">＋ <span>写一条</span></button></header><div class="content"><section class="project-head"><div><p class="overline">当前项目</p><h1 id="project-title">选择一个项目</h1><p id="project-desc">把已经解决的问题、做过的决定和下一步留在这里。</p></div><div class="project-menu-wrap"><button id="project-menu-button" class="dots" aria-label="项目操作" aria-expanded="false"><span></span><span></span><span></span></button><div id="project-menu" class="menu hidden"><button id="edit-project">编辑项目</button><button id="delete-project" class="danger">删除项目</button></div></div></section><div class="stats"><span><strong id="entry-count">0</strong> 条记录</span><i></i><span id="last-updated">还没有记录</span><span id="search-mode">关键词检索</span></div><section class="timeline"><header><h2 id="timeline-title">项目时间线</h2><span>最新在前</span></header><div id="entries"></div></section></div></section>
<nav class="mobile-nav"><button class="active">▦<span>工作台</span></button><button id="mobile-search">⌕<span>搜索</span></button><button id="mobile-add" class="mobile-add">＋</button><button id="mobile-projects">▤<span>项目</span></button><button><i class="online"></i><span>状态</span></button></nav></main>
<div id="modal" class="modal-backdrop hidden"><section class="modal"><header><div><p id="modal-overline" class="overline"></p><h2 id="modal-title"></h2></div><button id="modal-close" aria-label="关闭">×</button></header><form id="modal-form"></form></section></div><div id="confirm" class="modal-backdrop hidden"><section class="confirm-card"><p class="overline">不可恢复</p><h2 id="confirm-title">确认删除？</h2><p id="confirm-text"></p><div><button id="confirm-cancel">取消</button><button id="confirm-delete" class="delete-button">真删除</button></div></section></div><div id="toast" class="toast hidden"></div>
<script src="/static/app.js" defer></script></body></html>
